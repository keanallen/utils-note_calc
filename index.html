  <!-- Verify libraries are loaded -->

      console.log("Checking external libraries:");

      console.log(
        "docx available:",
        typeof docx !== "undefined" ? "✅" : "❌"
      );
      console.log("window.jspdf:", !!window.jspdf ? "✅" : "❌");
      console.log("window.jsPDF:", !!window.jsPDF ? "✅" : "❌");
      console.log("window.docx:", !!window.docx ? "✅" : "❌");
    });
  </script>
  <!-- adsense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8160871500191179"
    crossorigin="anonymous"></script>

          "Multi-calculator window support",

          "Offline-ready PWA",
          "Installable on desktop and mobile",
          "Fast real-time calculations",
          "Responsive, minimalist UI"
        ]
      }

  <style>
    .ql-toolbar {
      border-top-left-radius: 0.5rem;
      border-top-right-radius: 0.5rem;
      border-color: #374151 !important;
      /* gray-700 */
      background-color: #1f2937;
      /* gray-800 */
    }

    .ql-container {
      border-bottom-left-radius: 0.5rem;
      border-bottom-right-radius: 0.5rem;
      border-color: #374151 !important;
      /* gray-700 */
      color: #d1d5db;
      /* gray-300 */
      font-size: 1rem;
      height: 100%;
      background-color: #111827;
      /* gray-900 */
    }

    .ql-editor {
      height: 100%;
      padding: 12px;
    }

    .ql-editor.ql-blank::before {
      color: #6b7280;
      /* gray-500 */
      font-style: normal;
      left: 12px;
    }

    .ql-snow .ql-stroke {
      stroke: #9ca3af;
      /* gray-400 */
    }

    .ql-snow .ql-picker-label {
      color: #d1d5db;
      /* gray-300 */
    }

    .ql-snow .ql-fill,
    .ql-snow .ql-stroke.ql-fill {
      fill: #9ca3af;
      /* gray-400 */
    }

    .ql-snow .ql-picker-options {
      background-color: #374151;
      /* gray-700 */
      border-color: #4b5563;
      /* gray-600 */
    }

    .ql-snow .ql-picker-options .ql-picker-item {
      color: #d1d5db;
      /* gray-300 */
    }

    .ql-snow .ql-picker-options .ql-picker-item:hover {
      color: #ffffff;
      /* white */
    }

    .ql-snow .ql-picker-options .ql-picker-item.ql-selected {
      color: #67e8f9;
      /* cyan-300 */
    }

    /* Ensure the editor fills the available space */
    .notes-container {
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .quill-wrapper {
      flex-grow: 1;
      position: relative;
    }

    .quill-wrapper>.ql-container {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }

    /* Custom scrollbar for calculator display */
    .calculator-display {
      scrollbar-width: none;
      /* Firefox - hide scrollbar */
      scroll-behavior: smooth;
      overflow-x: auto;
      overflow-y: hidden;
    }

    /* Make the display text scrollable */
    .calculator-display-text {
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      /* Firefox - hide scrollbar */
      white-space: nowrap;
      min-width: 100%;
    }

    /* Webkit browsers - hide scrollbar */
    .calculator-display::-webkit-scrollbar,
    .calculator-display-text::-webkit-scrollbar {
      display: none;
      /* Safari and Chrome */
    }
  </style>
</head>

<body class="bg-gray-900">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("/service-worker.js")
          .then((registration) => {
            console.log("✅ ServiceWorker");
          })
          .catch((error) => {
            console.log("❌ ServiceWorker: ", error);
          });
      });
    }
  </script>
</body>

</html>
