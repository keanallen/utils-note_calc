<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Note Calc - The Ultimate PWA Calculator with Notes</title>
    <meta name="description" content="Note Calc is a powerful Progressive Web App (PWA) that lets you open multiple calculators and take rich-text notes simultaneously. Installable, offline-ready, and perfect for multitasking." />
    <meta name="keywords" content="pwa calculator, multi-calculator, calculator with notes, note taking app, offline calculator, installable web app, rich text editor, Note Calc" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a202c">

    <!-- Quill.js Rich Text Editor -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

    <!-- Export Libraries -->
    <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>
    <script src="https://unpkg.com/html-to-docx@1.8.0/dist/html-to-docx.js"></script>
    
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0"
  }
}
</script>

    <style>
      .ql-toolbar {
        border-top-left-radius: 0.5rem;
        border-top-right-radius: 0.5rem;
        border-color: #374151 !important; /* gray-700 */
        background-color: #1f2937; /* gray-800 */
      }
      .ql-container {
        border-bottom-left-radius: 0.5rem;
        border-bottom-right-radius: 0.5rem;
        border-color: #374151 !important; /* gray-700 */
        color: #d1d5db; /* gray-300 */
        font-size: 1rem;
        height: 100%;
        background-color: #111827; /* gray-900 */
      }
      .ql-editor {
        height: 100%;
        padding: 12px;
      }
      .ql-editor.ql-blank::before {
        color: #6b7280; /* gray-500 */
        font-style: normal;
        left: 12px;
      }
      .ql-snow .ql-stroke {
        stroke: #9ca3af; /* gray-400 */
      }
      .ql-snow .ql-picker-label {
        color: #d1d5db; /* gray-300 */
      }
      .ql-snow .ql-fill, .ql-snow .ql-stroke.ql-fill {
        fill: #9ca3af; /* gray-400 */
      }
      .ql-snow .ql-picker-options {
        background-color: #374151; /* gray-700 */
        border-color: #4b5563; /* gray-600 */
      }
      .ql-snow .ql-picker-options .ql-picker-item {
        color: #d1d5db; /* gray-300 */
      }
      .ql-snow .ql-picker-options .ql-picker-item:hover {
        color: #ffffff; /* white */
      }
       .ql-snow .ql-picker-options .ql-picker-item.ql-selected {
        color: #67e8f9; /* cyan-300 */
      }
      /* Ensure the editor fills the available space */
      .notes-container {
        height: 100%;
        display: flex;
        flex-direction: column;
      }
      .quill-wrapper {
        flex-grow: 1;
        position: relative;
      }
      .quill-wrapper > .ql-container {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
      }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-900">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').then(registration => {
            console.log('ServiceWorker registration successful with scope: ', registration.scope);
          }).catch(error => {
            console.log('ServiceWorker registration failed: ', error);
          });
        });
      }
    </script>
  </body>
</html>
